<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%">
  <defs>
    <linearGradient id="darkMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C99877"/>
      <stop offset="100%" stop-color="#E2B18E"/>
    </linearGradient>
    <linearGradient id="darkAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="darkHDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- LEFT ICON -->
    <g transform="translate(10, 5) scale(0.27)" filter="url(#darkHDrop)">
      <path d="M 256 36 L 440 142 L 440 370 L 256 476 L 72 370 L 72 142 Z"
            fill="#161311"
            stroke="url(#darkMarkGrad)"
            stroke-width="12"
            stroke-linejoin="round"/>
      
      <g fill="url(#darkMarkGrad)">
        <rect x="180" y="160" width="152" height="24" rx="12"/>
        <rect x="244" y="160" width="24" height="110" rx="12"/>
      </g>
      <path d="M 184 240 L 216 348 L 256 286 L 296 348 L 328 240"
            fill="none"
            stroke="url(#darkAccentGrad)"
            stroke-width="22"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <circle cx="256" cy="382" r="10" fill="#F59E0B"/>
    </g>

    <!-- RIGHT TYPOGRAPHY -->
    <g transform="translate(160, 68)">
      <text font-family="'Syne', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#FCF8F2">
        TEGEGN <tspan fill="#C99877">WUKIANOS</tspan>
      </text>
    </g>

    <g transform="translate(162, 104)">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Inter', monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#95A688">
        &lt;<tspan fill="#F59E0B">ETHIOPIAN DEVELOPER</tspan> /&gt;
      </text>
    </g>
  </g>
</svg>
