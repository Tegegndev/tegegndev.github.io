<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1A"/>
      <stop offset="50%" stop-color="#161311"/>
      <stop offset="100%" stop-color="#0A0807"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="avatarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D634D"/>
      <stop offset="50%" stop-color="#C99877"/>
      <stop offset="100%" stop-color="#6D7D63"/>
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="avatarDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#avatarBg)" stroke="url(#avatarBorder)" stroke-width="4" filter="url(#avatarDrop)"/>

  <!-- Developer Cyber Matrix Grid Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="352" x2="432" y2="352"/>
    <line x1="160" y1="80" x2="160" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="352" y1="80" x2="352" y2="432"/>
  </g>

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="245" r="140" fill="#8D634D" fill-opacity="0.15"/>

  <!-- Left Code Bracket -->
  <path d="M 130 216 L 90 256 L 130 296"
        fill="none"
        stroke="#6D7D63"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Right Code Bracket -->
  <path d="M 382 216 L 422 256 L 382 296"
        fill="none"
        stroke="#8D634D"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Developer Monogram: T & W -->
  <!-- Top T bar -->
  <rect x="168" y="160" width="176" height="20" rx="10" fill="url(#avatarBorder)"/>
  <!-- Vertical T stem -->
  <rect x="246" y="160" width="20" height="96" rx="10" fill="url(#avatarBorder)"/>

  <!-- W Dynamic Stroke -->
  <path d="M 178 238 L 212 344 L 256 280 L 300 344 L 334 238"
        fill="none"
        stroke="url(#avatarGlow)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Wolaita Sodo / Ethiopia Terminal Status Indicator -->
  <circle cx="256" cy="380" r="7" fill="#F59E0B"/>
  <text x="256" y="420" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="4" fill="#C99877" text-anchor="middle">TEGEGN DEV</text>
</svg>
