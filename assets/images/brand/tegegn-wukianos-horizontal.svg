<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%">
  <defs>
    <linearGradient id="hMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D634D"/>
      <stop offset="100%" stop-color="#C99877"/>
    </linearGradient>
    <linearGradient id="hAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="hDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2F2119" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- LEFT ICON: Modern Geometric Developer Badge -->
    <g transform="translate(10, 5) scale(0.27)" filter="url(#hDrop)">
      <!-- Hexagon Base -->
      <path d="M 256 36 L 440 142 L 440 370 L 256 476 L 72 370 L 72 142 Z"
            fill="#241E1A"
            stroke="url(#hMarkGrad)"
            stroke-width="12"
            stroke-linejoin="round"/>
      
      <!-- Monogram T & W -->
      <g fill="url(#hMarkGrad)">
        <rect x="180" y="160" width="152" height="24" rx="12"/>
        <rect x="244" y="160" width="24" height="110" rx="12"/>
      </g>
      <path d="M 184 240 L 216 348 L 256 286 L 296 348 L 328 240"
            fill="none"
            stroke="url(#hAccentGrad)"
            stroke-width="22"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <circle cx="256" cy="382" r="10" fill="#F59E0B"/>
    </g>

    <!-- RIGHT TYPOGRAPHY -->
    <!-- Name: TEGEGN WUKIANOS -->
    <g transform="translate(160, 68)">
      <text font-family="'Syne', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#2F2119">
        TEGEGN <tspan fill="#8D634D">WUKIANOS</tspan>
      </text>
    </g>

    <!-- Developer Sub-tagline -->
    <g transform="translate(162, 104)">
      <!-- Bracket & Slash motif -->
      <text font-family="'JetBrains Mono', 'Fira Code', 'Inter', monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#2E6F78">
        &lt;<tspan fill="#C99877">ETHIOPIAN DEVELOPER</tspan> /&gt;
      </text>
    </g>
  </g>
</svg>
