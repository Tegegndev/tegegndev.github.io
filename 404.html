<!DOCTYPE html>
<html lang="en-ET" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://tegegn.com.et/">
  <title>Page Not Found | Tegegn Wukianos</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/images/brand/tw-developer-mark.svg">
  <link href="assets/fonts/google/fonts.css" rel="stylesheet">
  <style>
    :root {
      --bg: #161311;
      --card-bg: #221c18;
      --border: #382c24;
      --accent: #c99877;
      --accent-dim: #8d634d;
      --text: #fcf8f2;
      --muted: #a39285;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(201, 152, 119, 0.12);
      border: 1px solid var(--accent-dim);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #161311;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #dfb191;
      transform: translateY(-2px);
    }
    .timer-note {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">404 Error</span>
    <h1>404</h1>
    <p>The page you are looking for has moved or does not exist. Redirecting you to our primary domain <strong>tegegn.com.et</strong>.</p>
    <a href="https://tegegn.com.et/" class="btn">Return to Homepage</a>
  </div>
</body>
</html>
